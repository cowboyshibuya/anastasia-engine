[package]
name = "anastasia-app-core"
version = "0.1.0"
edition = "2024"
publish = false

# Application core for anastasia: all non-presentation modules (server, agent,
# provider, auth, session, tool, config, etc.) extracted out of the monolithic
# root `anastasia` crate so they compile as a separate rustc unit. The root `anastasia`
# crate (cli + tui + bin) re-exports this crate's modules via `pub use
# anastasia_app_core::*`, preserving every existing `crate::<module>` path.

[lib]
name = "anastasia_app_core"
path = "src/lib.rs"

[dependencies]
# NOTE: the jemalloc allocator stats live in `anastasia-base` (process_memory) and
# local embeddings live in `anastasia-base` (embedding); this crate forwards those
# features to anastasia-base rather than depending on the backing crates directly.

# Async runtime
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
async-trait = "0.1"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "blocking", "charset", "http2", "system-proxy", "rustls-tls", "rustls-tls-native-roots"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

# CLI

# File operations
glob = "0.3"
similar = "2"            # diffing for edits

# Utilities
dirs = "5"               # home directory
anyhow = "1"
libc = "0.2"             # Unix system calls (flock)
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
urlencoding = "2"        # URL encoding for web search
uuid = { version = "1", features = ["v4", "v5"] }

# Embeddings (local inference) live in anastasia-base; this crate forwards the
# `embeddings` feature to anastasia-base rather than depending on anastasia-embedding.
anastasia-import-core = { path = "../anastasia-import-core" }

# OAuth
base64 = "0.22"
sha2 = "0.10"
rand = "0.9.3"
url = "2"
open = "5"               # Open URLs in browser
anastasia-agent-runtime = { path = "../anastasia-agent-runtime" }
anastasia-ambient-types = { path = "../anastasia-ambient-types" }
anastasia-notify-email = { path = "../anastasia-notify-email" }
anastasia-provider-core = { path = "../anastasia-provider-core" }
anastasia-schema-dialect = { path = "../anastasia-schema-dialect" }
# NOTE: anastasia-app-core does NOT depend on any anastasia-tui-* crate. They were
# unused dead dependency edges here (the TUI declares them itself). Removing
# them stops a anastasia-tui-* edit from cascading a recompile through app-core.
anastasia-update-core = { path = "../anastasia-update-core" }
anastasia-terminal-image = { path = "../anastasia-terminal-image" }

# Streaming
tokio-stream = "0.1"

# TUI
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }

# Markdown & syntax highlighting
unicode-width = "0.2"   # Unicode character display width

# PDF parsing (behind feature flag)
anastasia-pdf = { path = "../anastasia-pdf", optional = true }
anastasia-build-support = { path = "../anastasia-build-support" }
anastasia-build-meta = { path = "../anastasia-build-meta" }

# Foundational layer (provider, auth, config, session, message, memory, ...).
# Re-exported via `pub use anastasia_base::*` in lib.rs. default-features=false so
# this crate controls anastasia-base's optional features (see [features] below).
anastasia-base = { path = "../anastasia-base", default-features = false }
anastasia-command-risk = { path = "../anastasia-command-risk" }
anastasia-core = { path = "../anastasia-core" }
anastasia-message-types = { path = "../anastasia-message-types" }
anastasia-overnight-core = { path = "../anastasia-overnight-core" }
anastasia-plan = { path = "../anastasia-plan" }
anastasia-swarm-core = { path = "../anastasia-swarm-core" }
anastasia-selfdev-types = { path = "../anastasia-selfdev-types" }
anastasia-session-types = { path = "../anastasia-session-types" }
anastasia-setup-hints = { path = "../anastasia-setup-hints" }
anastasia-task-types = { path = "../anastasia-task-types" }
anastasia-tool-core = { path = "../anastasia-tool-core" }
anastasia-tool-types = { path = "../anastasia-tool-types" }

# Archive extraction (for auto-update)
flate2 = "1"
tar = "0.4"
tempfile = "3"
agentgrep = { git = "https://github.com/1jehuang/agentgrep.git", tag = "v0.1.6" }

[features]
default = ["pdf", "embeddings", "bedrock"]
# jemalloc allocator stats live in anastasia-base (process_memory); forward there.
jemalloc = ["anastasia-base/jemalloc"]
jemalloc-prof = ["anastasia-base/jemalloc-prof"]
# local embeddings live in anastasia-base (embedding); forward there.
embeddings = ["anastasia-base/embeddings"]
# live AWS Bedrock support lives in anastasia-base (provider/bedrock); forward there.
bedrock = ["anastasia-base/bedrock"]
# Used only by the CentOS 7 portable Linux release build.
linux-compat-vendored-openssl = ["anastasia-notify-email/linux-compat-vendored-openssl"]
# PDF text extraction lives in this crate (tool/read.rs).
pdf = ["dep:anastasia-pdf"]
# Compiles this crate's test-only helpers/accessors (e.g. the
# ExternalAuthReviewCandidate read accessors) as `pub` and forwards
# anastasia-base's `test-support` so downstream crates' test targets can reach the
# whole stack's helpers. Never enabled in normal (non-test) builds.
test-support = ["anastasia-base/test-support"]

[dev-dependencies]
# Used by async streaming tests (ambient/runner_tests, server/client_actions_tests).
async-stream = "0.3"
# Enables anastasia-base's test-support helpers (storage::lock_test_env,
# auth::test_sandbox, bus::reset_models_updated_publish_state_for_tests) for
# *this* crate's own test target. Feature unification applies this only to
# test/bench/example builds, not to a normal `cargo build`.
anastasia-base = { path = "../anastasia-base", default-features = false, features = ["test-support"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Native desktop control for the `macos_computer_use` tool (synthetic mouse/keyboard
# events, cursor positioning, display bounds). `highsierra` enables the
# CGEventCreateScrollWheelEvent2 binding used for scroll.
core-graphics = { version = "0.23", features = ["highsierra"] }
