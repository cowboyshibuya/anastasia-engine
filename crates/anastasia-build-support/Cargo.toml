[package]
name = "anastasia-build-support"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
anastasia-core = { path = "../anastasia-core" }
anastasia-selfdev-types = { path = "../anastasia-selfdev-types" }
anastasia-storage = { path = "../anastasia-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
