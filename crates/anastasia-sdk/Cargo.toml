[package]
name = "anastasia-sdk"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust SDK for the anastasia harness API: connect, drive sessions, stream events"

[dependencies]
anastasia-harness-api = { path = "../anastasia-harness-api" }
anastasia-transport = { path = "../anastasia-transport" }
jsonschema = { version = "0.49.3", default-features = false }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
