[package]
name = "anastasia-tui-permissions"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "anastasia_tui_permissions"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
crossterm = { version = "0.29", features = ["event-stream"] }
anastasia-base = { path = "../anastasia-base", default-features = false }
anastasia-core = { path = "../anastasia-core" }
anastasia-tui-style = { path = "../anastasia-tui-style" }
ratatui = "0.30"
serde_json = "1"
